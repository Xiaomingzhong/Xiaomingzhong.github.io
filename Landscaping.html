<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Landscaping | Xiaoming (Marcus) Zhong</title>
    <!-- 引入 Playfair Display 衬线体和 Inter 无衬线体 -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* ==================== 基础样式与字体 ==================== */
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --text-secondary: #666666;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-serif: 'Playfair Display', "Georgia", "Noto Serif SC", serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-sans);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* ==================== 顶部导航栏 ==================== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            padding: 24px 48px;
            display: flex;
            justify-content: center; 
            align-items: center;
            z-index: 1000;
            background-color: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .nav-links {
            display: flex;
            gap: 48px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.05em;
            position: relative;
            padding-bottom: 4px;
            transition: color 0.3s ease;
            white-space: nowrap;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0%;
            height: 1px;
            background-color: var(--text-color);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after, .nav-links a.active::after {
            width: 100%;
        }

        .lang-switch {
            position: fixed;
            top: 22px;
            right: 48px;
            z-index: 1001; 
            background: none;
            border: 1px solid rgba(0, 0, 0, 0.15);
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 100px;
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.05em;
            color: var(--text-color);
            transition: all 0.3s ease;
        }

        .lang-switch:hover {
            border-color: #000000;
            background-color: #ffffff;
            transform: scale(1.03);
        }

        /* ==================== 页面主体布局 ==================== */
        main {
            padding-top: 120px;
            padding-bottom: 80px;
            max-width: 1920px;
            margin: 0 auto;
            width: 96%;
        }

        /* 顶部动作栏 (返回按钮 + 标题) */
        .page-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin-bottom: 80px;
            margin-top: 40px;
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .back-btn {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            text-decoration: none;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-secondary);
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            color: #000000;
        }

        .page-header h1 {
            font-family: var(--font-serif);
            font-size: clamp(2.5rem, 4vw, 4rem);
            font-weight: 400;
            letter-spacing: -0.02em;
            color: #000000;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==================== 动态图片网格 (Gallery Grid) ==================== */
        .gallery-grid {
            display: grid;
            /* 桌面与中等屏幕采用每行 4 格，完整展示景观设计作品 */
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            opacity: 1; /* 不再让整个画廊等待淡入，打开页面即可看到大量作品 */
            perspective: 1200px;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 1 / 1; /* 每个画廊单元固定为正方形 */
            overflow: hidden;
            cursor: zoom-in; /* 提示可点击放大 */
            background-color: #f5f5f5;
            isolation: isolate;
            transform-origin: center;
            animation: tileReveal 0.62s cubic-bezier(0.16, 1, 0.3, 1) both;
            animation-delay: var(--reveal-delay, 0ms);
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 0.45s ease;
            will-change: transform;
        }

        /* 快速显现：始终保持作品可见，只加入轻微的位移与聚焦感 */
        @keyframes tileReveal {
            from {
                opacity: 0.82;
                transform: translateY(14px) scale(0.965);
                filter: brightness(1.08);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: brightness(1);
            }
        }

        /* 方格边缘的细微高光 */
        .gallery-item::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.025);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        /* 悬停时快速掠过的光线，不遮挡作品本身 */
        .gallery-item::after {
            content: '';
            position: absolute;
            top: -30%;
            left: -75%;
            width: 48%;
            height: 160%;
            z-index: 3;
            pointer-events: none;
            background: linear-gradient(
                105deg,
                transparent 15%,
                rgba(255, 255, 255, 0.08) 35%,
                rgba(255, 255, 255, 0.38) 50%,
                rgba(255, 255, 255, 0.08) 65%,
                transparent 85%
            );
            transform: translateX(0) skewX(-18deg);
            transition: transform 0.82s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 1; /* 原来为 0.8，是画面发淡的主要原因之一 */
            filter: saturate(1.05) contrast(1.03); /* 恢复并轻微加强作品颜色层次 */
            transform: scale(1.015);
            backface-visibility: hidden;
            transition: transform 0.75s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 0.65s ease;
            will-change: transform, filter;
        }


        /* 视频项目：网格中仍显示封面图，并用播放按钮提示可播放 */
        .gallery-item.video-item {
            cursor: pointer;
        }

        .video-play-badge {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 4;
            width: clamp(34px, 3.2vw, 52px);
            height: clamp(34px, 3.2vw, 52px);
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 50%;
            background: rgba(10, 10, 10, 0.42);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
            backdrop-filter: blur(8px);
            transform: translate(-50%, -50%) scale(0.92);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                        background-color 0.4s ease;
            pointer-events: none;
        }

        .video-play-badge svg {
            width: 42%;
            height: 42%;
            fill: #ffffff;
            transform: translateX(5%);
        }

        .gallery-item.video-item:hover .video-play-badge {
            background: rgba(0, 0, 0, 0.62);
            transform: translate(-50%, -50%) scale(1.06);
        }

        /* 鼠标滑过：轻微抬升、景深放大和光扫动画 */
        .gallery-item:hover {
            z-index: 5;
            transform: translateY(-5px) scale(1.018);
            box-shadow: 0 16px 34px rgba(0, 0, 0, 0.16);
        }

        .gallery-item:hover::before {
            border-color: rgba(255, 255, 255, 0.62);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
        }

        .gallery-item:hover::after {
            transform: translateX(390%) skewX(-18deg);
        }

        .gallery-item:hover img {
            opacity: 1;
            filter: saturate(1.12) contrast(1.06);
            transform: scale(1.10);
        }

        /* 尊重系统的减少动态效果设置 */
        @media (prefers-reduced-motion: reduce) {
            .gallery-item {
                animation: none;
                transition: none;
            }

            .gallery-item::after,
            .gallery-item img {
                transition: none;
            }
        }

        /* ==================== 沉浸式全屏画廊 (Lightbox) ==================== */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.98); /* 极致留白的毛玻璃背景 */
            backdrop-filter: blur(20px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-img-wrapper {
            position: relative;
            width: 85vw;
            height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lightbox img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08); /* 优雅的软阴影 */
            transform: scale(0.95);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lightbox.active img {
            transform: scale(1);
        }


        /* 在线视频播放器：仅当当前项目为视频时显示 */
        .lightbox-video {
            display: none;
            width: min(85vw, 142.22vh);
            height: min(47.8125vw, 80vh);
            border: 0;
            background: #000000;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
            opacity: 0;
            transform: scale(0.965);
            transition: opacity 0.35s ease,
                        transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lightbox.video-mode #lightboxImage {
            display: none;
        }

        .lightbox.video-mode .lightbox-video {
            display: block;
        }

        .lightbox.video-mode.active .lightbox-video {
            opacity: 1;
            transform: scale(1);
        }

        /* 左右与关闭按钮 */
        .lightbox-btn {
            position: absolute;
            background: none;
            border: none;
            cursor: pointer;
            color: #111111;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: transform 0.3s ease;
        }

        .lightbox-btn:hover {
            transform: scale(1.2);
        }

        .lightbox-btn svg {
            width: 32px;
            height: 32px;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
        }

        .btn-prev { left: -60px; top: 50%; transform: translateY(-50%); }
        .btn-next { right: -60px; top: 50%; transform: translateY(-50%); }
        
        .btn-close {
            position: fixed;
            top: 32px;
            right: 48px;
            padding: 10px;
        }

        .btn-prev:hover { transform: translateY(-50%) translateX(-5px); }
        .btn-next:hover { transform: translateY(-50%) translateX(5px); }

        /* ==================== 页脚 ==================== */
        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            margin-top: 100px;
        }

        footer p {
            font-size: 12px;
            color: #999999;
            letter-spacing: 0.05em;
            font-family: var(--font-sans);
        }

        /* ==================== 横屏桌面端：每行固定 4 格 ==================== */
        @media (min-width: 1024px) and (orientation: landscape) {
            .gallery-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 12px;
            }
        }


        /* ==================== 平板端适配 ==================== */
        @media (min-width: 769px) and (max-width: 1023px) {
            .gallery-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 16px;
            }
        }

        /* ==================== 手机端适配 ==================== */
        @media (max-width: 768px) {
            header { padding: 16px 20px; justify-content: flex-start; }
            .nav-links { gap: 24px; overflow-x: auto; width: 100%; padding-bottom: 4px; }
            .nav-links::-webkit-scrollbar { display: none; }
            .lang-switch { top: 14px; right: 20px; font-size: 10px; }
            
            .page-header { margin-top: 20px; margin-bottom: 50px; }
            .back-btn { position: relative; top: 0; transform: none; margin-bottom: 24px; left: -30vw; }
            .gallery-grid { grid-template-columns: 1fr; gap: 24px; }
            
            /* 手机端按钮位置调整 */
            .btn-prev { left: 10px; }
            .btn-next { right: 10px; }
            .btn-close { top: 16px; right: 16px; }
            .lightbox-img-wrapper { width: 100vw; height: 100vh; padding: 0 60px; }
        }
    

        /* ==================== 手机端双行完整导航（统一修复） ==================== */
        @media (max-width: 768px) {
            header {
                justify-content: center !important;
                align-items: flex-end !important;
                min-height: 112px !important;
                padding: 42px 14px 12px !important;
            }

            header nav {
                width: 100% !important;
                overflow: visible !important;
            }

            .nav-links {
                width: 100% !important;
                display: flex !important;
                flex-wrap: wrap !important;
                justify-content: center !important;
                align-items: center !important;
                column-gap: 14px !important;
                row-gap: 8px !important;
                overflow: visible !important;
                padding: 0 !important;
            }

            .nav-links li {
                flex: 0 0 auto !important;
            }

            .nav-links a {
                padding-bottom: 2px !important;
                font-size: 10px !important;
                letter-spacing: 0.025em !important;
                white-space: nowrap !important;
            }

            .lang-switch {
                top: 8px !important;
                right: 12px !important;
                padding: 6px 11px !important;
                font-size: 9px !important;
            }

            main {
                padding-top: 146px !important;
            }
        }

        /* 较窄手机继续保持两行，不让长英文栏目挤到第三行 */
        @media (max-width: 360px) {
            .nav-links {
                column-gap: 9px !important;
                row-gap: 7px !important;
            }

            .nav-links a {
                font-size: 9px !important;
                letter-spacing: 0 !important;
            }
        }

    </style>
</head>

            { src: "https://digital-media-works.oss-cn-hongkong.aliyuncs.com/LandscapeWebp/15999cb4-01a4-4e25-90db-4669d2e3e4c8%20copy.webp?x-oss-credential=LTAI5tBdG5iyKFmFCeH6Jn8w%2F20260715%2Fcn-hongkong%2Foss%2Faliyun_v4_request&x-oss-date=20260715T041245Z&x-oss-expires=3600&x-oss-signature-version=OSS4-HMAC-SHA256&x-oss-signature=9c86ffdb5703922d0e86e1fe4b82c6f16cc944486447c07f931f8e21f240deb5" },
            { src: "https://digital-media-works.oss-cn-hongkong.aliyuncs.com/LandscapeWebp/c7217339-dbcd-479d-857d-cbc798f13111%20copy.webp?x-oss-credential=LTAI5tBdG5iyKFmFCeH6Jn8w%2F20260715%2Fcn-hongkong%2Foss%2Faliyun_v4_request&x-oss-date=20260715T041306Z&x-oss-expires=3600&x-oss-signature-version=OSS4-HMAC-SHA256&x-oss-signature=afe1f785e34700c8bc297d35046ca2c77ad90c38f946060c39a2d600832f5382" },
            {
                src: "https://digital-media-works.oss-cn-hongkong.aliyuncs.com/LandscapeWebp/Gemini_Generated_Image_9hhf9b9hhf9b9hhf%20copy.webp?x-oss-credential=LTAI5tBdG5iyKFmFCeH6Jn8w%2F20260715%2Fcn-hongkong%2Foss%2Faliyun_v4_request&x-oss-date=20260715T041329Z&x-oss-expires=3600&x-oss-signature-version=OSS4-HMAC-SHA256&x-oss-signature=f2842d419e4dff9097b96fa0d304183fdf600998b59b4ae791b2695f0478395d",
                type: "video",
                embed: "https://player.xinpianchang.com/?aid=13750387&mid=9WxJ7lVGv8m481kM"
            },
        ];

        /* ==================== 1. 自动生成图片网格 ==================== */
        const galleryContainer = document.getElementById('galleryContainer');
        
        galleryData.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = item.type === 'video' ? 'gallery-item video-item' : 'gallery-item';

            // 动画延迟最多约 0.27 秒，形成横向波浪感，但不会阻碍观众快速浏览作品。
            div.style.setProperty('--reveal-delay', `${(index % 20) * 14}ms`);

            // 点击方格时，打开对应序号的全屏图片
            div.onclick = () => openLightbox(index);
            
            const img = document.createElement('img');
            img.src = item.src;
            img.alt = `Landscaping project ${index + 1}`;
            img.decoding = 'async';

            // 首屏前两行优先加载，其余作品继续懒加载，兼顾“第一眼看到很多”和页面性能。
            img.loading = index < 8 ? 'eager' : 'lazy';
            if (index < 4) img.fetchPriority = 'high';
            
            div.appendChild(img);

            if (item.type === 'video') {
                const playBadge = document.createElement('span');
                playBadge.className = 'video-play-badge';
                playBadge.setAttribute('aria-hidden', 'true');
                playBadge.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>';
                div.appendChild(playBadge);
                div.setAttribute('aria-label', 'Play video');
            }

            galleryContainer.appendChild(div);
        });

        /* ==================== 2. 全屏画廊 (Lightbox) 交互逻辑 ==================== */
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxVideo = document.getElementById('lightboxVideo');
        let currentIndex = 0;

        function openLightbox(index) {
            currentIndex = index;
            updateLightboxImage();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; // 锁住背景，防止滚动网页
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = ''; // 解除滚动锁定

            // 清空播放器地址，确保关闭后视频立即停止播放。
            lightboxVideo.src = '';
            lightbox.classList.remove('video-mode');
        }

        function updateLightboxImage() {
            const item = galleryData[currentIndex];

            // 每次切换前先停止上一条视频，避免声音继续播放。
            lightboxVideo.src = '';

            if (item.type === 'video') {
                lightbox.classList.add('video-mode');
                lightboxImage.style.opacity = '0';
                lightboxVideo.src = item.embed;
                return;
            }

            lightbox.classList.remove('video-mode');
            lightboxImage.style.opacity = '0';

            // 图片切换保留轻微淡入过渡。
            setTimeout(() => {
                lightboxImage.src = item.src;
                lightboxImage.alt = `Landscaping project ${currentIndex + 1}`;
                lightboxImage.style.opacity = '1';
            }, 150);
        }

        function showNext() {
            currentIndex = (currentIndex + 1) % galleryData.length;
            updateLightboxImage();
        }

        function showPrev() {
            currentIndex = (currentIndex - 1 + galleryData.length) % galleryData.length;
            updateLightboxImage();
        }

        // 绑定按钮事件
        document.getElementById('closeLightbox').onclick = closeLightbox;
        document.getElementById('nextImage').onclick = showNext;
        document.getElementById('prevImage').onclick = showPrev;

        // 绑定键盘左右键和 ESC 键
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'ArrowRight') showNext();
            if (e.key === 'ArrowLeft') showPrev();
            if (e.key === 'Escape') closeLightbox();
        });

        // 点击背景区域也可以关闭画廊
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox || e.target.classList.contains('lightbox-img-wrapper')) {
                closeLightbox();
            }
        });

        /* ==================== 3. 双语切换逻辑 ==================== */
        const langBtn = document.getElementById('langBtn');
        const i18nElements = document.querySelectorAll('.i18n');
        let currentLang = 'en'; 

        langBtn.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'cn' : 'en';
            
            i18nElements.forEach(el => {
                const targetText = el.getAttribute(`data-${currentLang}`);
                if (targetText) {
                    el.innerHTML = targetText;
                }
            });
            langBtn.innerText = currentLang === 'en' ? 'EN / 简' : '简 / EN';
        });
    </script>
</body>
</html>
