<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Graphic Design | Xiaoming (Marcus) Zhong</title>
    <!-- 引入 Playfair Display 衬线体和 Inter 无衬线体 -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* ==================== 基础样式与字体 ==================== */
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --text-secondary: #666666;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-serif: 'Playfair Display', "Georgia", "Noto Serif SC", serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-sans);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* ==================== 顶部导航栏 ==================== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            padding: 24px 48px;
            display: flex;
            justify-content: center; 
            align-items: center;
            z-index: 1000;
            background-color: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .nav-links {
            display: flex;
            gap: 48px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.05em;
            position: relative;
            padding-bottom: 4px;
            transition: color 0.3s ease;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0%;
            height: 1px;
            background-color: var(--text-color);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after, .nav-links a.active::after {
            width: 100%;
        }

        .lang-switch {
            position: fixed;
            top: 22px;
            right: 48px;
            z-index: 1001; 
            background: none;
            border: 1px solid rgba(0, 0, 0, 0.15);
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 100px;
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.05em;
            color: var(--text-color);
            transition: all 0.3s ease;
        }

        .lang-switch:hover {
            border-color: #000000;
            background-color: #ffffff;
            transform: scale(1.03);
        }

        /* ==================== 页面主体布局 ==================== */
        main {
            padding-top: 120px; 
            padding-bottom: 80px;
            max-width: 1400px; 
            margin: 0 auto;
            width: 92%;
        }

        /* 顶部动作栏 (返回按钮 + 标题) */
        .page-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin-bottom: 80px;
            margin-top: 40px;
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .back-btn {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            text-decoration: none;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-secondary);
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            color: #000000;
        }

        .page-header h1 {
            font-family: var(--font-serif);
            font-size: clamp(2.5rem, 4vw, 4rem);
            font-weight: 400;
            letter-spacing: -0.02em;
            color: #000000;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==================== 动态图片网格 (Gallery Grid) ==================== */
        .gallery-grid {
            display: grid;
            /* 自动响应式排版：桌面端3列，平板2列，手机1列 */
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 32px;
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 4/5; /* 统一高级画幅 */
            overflow: hidden;
            cursor: zoom-in; /* 提示可点击放大 */
            background-color: #f5f5f5;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0.8;
            filter: grayscale(30%);
            transform: scale(1.02); /* 默认微小放大，预留收缩空间 */
            transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1), 
                        filter 0.8s ease, 
                        opacity 0.8s ease;
        }

        /* 鼠标滑过：方格内最大化显示效果 */
        .gallery-item:hover img {
            opacity: 1;
            filter: grayscale(0%);
            transform: scale(1.12); /* 极致放大 */
        }

        /* ==================== 沉浸式全屏画廊 (Lightbox) ==================== */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.98); /* 极致留白的毛玻璃背景 */
            backdrop-filter: blur(20px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-img-wrapper {
            position: relative;
            width: 85vw;
            height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lightbox img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08); /* 优雅的软阴影 */
            transform: scale(0.95);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lightbox.active img {
            transform: scale(1);
        }

        /* 左右与关闭按钮 */
        .lightbox-btn {
            position: absolute;
            background: none;
            border: none;
            cursor: pointer;
            color: #111111;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: transform 0.3s ease;
        }

        .lightbox-btn:hover {
            transform: scale(1.2);
        }

        .lightbox-btn svg {
            width: 32px;
            height: 32px;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
        }

        .btn-prev { left: -60px; top: 50%; transform: translateY(-50%); }
        .btn-next { right: -60px; top: 50%; transform: translateY(-50%); }
        
        .btn-close {
            position: fixed;
            top: 32px;
            right: 48px;
            padding: 10px;
        }

        .btn-prev:hover { transform: translateY(-50%) translateX(-5px); }
        .btn-next:hover { transform: translateY(-50%) translateX(5px); }

        /* ==================== 页脚 ==================== */
        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            margin-top: 100px;
        }

        footer p {
            font-size: 12px;
            color: #999999;
            letter-spacing: 0.05em;
            font-family: var(--font-sans);
        }

        /* ==================== 手机端适配 ==================== */
        @media (max-width: 768px) {
            header { padding: 16px 20px; justify-content: flex-start; }
            .nav-links { gap: 24px; overflow-x: auto; width: 100%; padding-bottom: 4px; }
            .nav-links::-webkit-scrollbar { display: none; }
            .lang-switch { top: 14px; right: 20px; font-size: 10px; }
            
            .page-header { margin-top: 20px; margin-bottom: 50px; }
            .back-btn { position: relative; top: 0; transform: none; margin-bottom: 24px; left: -30vw; }
            .gallery-grid { grid-template-columns: 1fr; gap: 24px; }
            
            /* 手机端按钮位置调整 */
            .btn-prev { left: 10px; }
            .btn-next { right: 10px; }
            .btn-close { top: 16px; right: 16px; }
            .lightbox-img-wrapper { width: 100vw; height: 100vh; padding: 0 60px; }
        }
    </style>
</head>
<body>

    <button class="lang-switch" id="langBtn">EN / 简</button>

    <!-- 顶部导航栏 -->
    <header id="navbar">
        <nav>
            <ul class="nav-links">
                <li><a href="index.html" class="i18n" data-cn="首页" data-en="Home">Home</a></li>
                <li><a href="graphic-design.html" class="i18n active" data-cn="影视美学" data-en="Cinematography">Cinematographer</a></li>
                <li><a href="Photography.html" class="i18n" data-cn="摄影艺术" data-en="Photography">Photography</a></li>
                <li><a href="Landscaping.html" class="i18n" data-cn="景观设计" data-en="Landscaping">Landscaping</a></li>
                <li><a href="Research.html" class="i18n" data-cn="数字媒体探索" data-en="Research">Research</a></li>
                <li><a href="About_me.html" class="i18n" data-cn="关于我" data-en="About Me">About Me</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- 页面头部：返回按钮 + 标题 -->
        <div class="page-header">
            <!-- 核心交互：返回到 Research.html -->
            <a href="Research.html" class="back-btn i18n" data-cn="← 返回探索" data-en="← Back to Research">← Back to Research</a>
            <h1 class="i18n" data-cn="平面设计" data-en="Graphic Design">Graphic Design</h1>
        </div>

        <!-- 空容器：将由下方的 JS 自动根据数据填充图片方格 -->
        <section class="gallery-grid" id="galleryContainer">
            <!-- JS 生成内容 -->
        </section>
    </main>

    <!-- 隐藏的全屏画廊 (Lightbox) -->
    <div class="lightbox" id="lightbox">
        <!-- 关闭按钮 -->
        <button class="lightbox-btn btn-close" id="closeLightbox">
            <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"></path></svg>
        </button>
        
        <div class="lightbox-img-wrapper">
            <!-- 左箭头 -->
            <button class="lightbox-btn btn-prev" id="prevImage">
                <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></svg>
            </button>
            
            <!-- 大图展示区 -->
            <img id="lightboxImage" src="" alt="">
            
            <!-- 右箭头 -->
            <button class="lightbox-btn btn-next" id="nextImage">
                <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"></path></svg>
            </button>
        </div>
    </div>

    <footer>
        <p>© 2026 Xiaoming (Marcus) Zhong. All rights reserved[cite: 1]</p>
    </footer>

    <script>
        /* =================================================================
           【设计核心】数据驱动的画廊系统 (后期修改只需更改这里！)
           ================================================================= */
        const galleryData = [
            // 你只需要在这里无限往下添加 { src: '你的图片链接' } 即可！
            // 系统会自动生成缩略图方格，并自动加入左右滑动的全屏画廊中。
            { src: 'https://images.unsplash.com/photo-1626785774573-4b799315345d?q=80&w=1000&auto=format&fit=crop' },
            { src: 'https://images.unsplash.com/photo-1561070791-2526d30994b5?q=80&w=1000&auto=format&fit=crop' },
            { src: 'https://images.unsplash.com/photo-1558655146-d09347e92766?q=80&w=1000&auto=format&fit=crop' },
            { src: 'https://images.unsplash.com/photo-1611532736597-de2d4265fba3?q=80&w=1000&auto=format&fit=crop' },
            { src: 'https://images.unsplash.com/photo-1620061427848-18e385ea4f84?q=80&w=1000&auto=format&fit=crop' },
            { src: 'https://images.unsplash.com/photo-1549490349-8643362247b5?q=80&w=1000&auto=format&fit=crop' }
        ];

        /* ==================== 1. 自动生成图片网格 ==================== */
        const galleryContainer = document.getElementById('galleryContainer');
        
        galleryData.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'gallery-item';
            // 点击方格时，打开对应序号的全屏图片
            div.onclick = () => openLightbox(index);
            
            const img = document.createElement('img');
            img.src = item.src;
            img.loading = "lazy"; // 提高网页加载性能
            
            div.appendChild(img);
            galleryContainer.appendChild(div);
        });

        /* ==================== 2. 全屏画廊 (Lightbox) 交互逻辑 ==================== */
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        let currentIndex = 0;

        function openLightbox(index) {
            currentIndex = index;
            updateLightboxImage();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; // 锁住背景，防止滚动网页
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = ''; // 解除滚动锁定
        }

        function updateLightboxImage() {
            // 切换图片时，增加一个透明度微小的过渡会更高级
            lightboxImage.style.opacity = '0';
            setTimeout(() => {
                lightboxImage.src = galleryData[currentIndex].src;
                lightboxImage.style.opacity = '1';
            }, 150);
        }

        function showNext() {
            // 循环逻辑：到了最后一张，下一张变成第一张
            currentIndex = (currentIndex + 1) % galleryData.length;
            updateLightboxImage();
        }

        function showPrev() {
            // 循环逻辑：到了第一张，上一张变成最后一张
            currentIndex = (currentIndex - 1 + galleryData.length) % galleryData.length;
            updateLightboxImage();
        }

        // 绑定按钮事件
        document.getElementById('closeLightbox').onclick = closeLightbox;
        document.getElementById('nextImage').onclick = showNext;
        document.getElementById('prevImage').onclick = showPrev;

        // 绑定键盘左右键和 ESC 键
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'ArrowRight') showNext();
            if (e.key === 'ArrowLeft') showPrev();
            if (e.key === 'Escape') closeLightbox();
        });

        // 点击背景区域也可以关闭画廊
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox || e.target.classList.contains('lightbox-img-wrapper')) {
                closeLightbox();
            }
        });

        /* ==================== 3. 双语切换逻辑 ==================== */
        const langBtn = document.getElementById('langBtn');
        const i18nElements = document.querySelectorAll('.i18n');
        let currentLang = 'en'; 

        langBtn.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'cn' : 'en';
            
            i18nElements.forEach(el => {
                const targetText = el.getAttribute(`data-${currentLang}`);
                if (targetText) {
                    el.innerHTML = targetText;
                }
            });
            langBtn.innerText = currentLang === 'en' ? 'EN / 简' : '简 / EN';
        });
    </script>
</body>
</html>
