<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Pose-to-Character AI - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: 'Inter', sans-serif; }
        canvas { display: block; }
        .ui-card { backdrop-filter: blur(12px); background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <div class="fixed top-6 left-6 z-10 space-y-4">
        <div class="ui-card p-6 rounded-3xl shadow-2xl text-white w-80">
            <h1 class="text-2xl font-black mb-1 bg-gradient-to-r from-amber-200 to-yellow-500 bg-clip-text text-transparent">3D POSE AI</h1>
            <p class="text-[10px] text-gray-400 uppercase tracking-widest mb-6">Wooden Mannequin Editor</p>
            
            <div class="space-y-5">
                <div>
                    <label class="text-[10px] font-bold text-gray-500 uppercase mb-2 block">Quick Poses</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="applyPose('tpose')" class="bg-slate-800 hover:bg-slate-700 py-2 rounded-xl text-xs transition border border-slate-700">Default</button>
                        <button onclick="applyPose('run')" class="bg-slate-800 hover:bg-slate-700 py-2 rounded-xl text-xs transition border border-slate-700">Running</button>
                        <button onclick="applyPose('sit')" class="bg-slate-800 hover:bg-slate-700 py-2 rounded-xl text-xs transition border border-slate-700">Sitting</button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase mb-2 block">Lens</label>
                        <select id="lensSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs outline-none">
                            <option value="45">Standard</option>
                            <option value="28">Wide</option>
                            <option value="85">Tele</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase mb-2 block">Ratio</label>
                        <select id="ratioSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs outline-none">
                            <option value="1">1:1</option>
                            <option value="0.75">3:4</option>
                            <option value="1.77">16:9</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="fixed bottom-10 left-1/2 -translate-x-1/2 z-10 flex flex-col items-center gap-3">
        <p class="text-white/40 text-[10px] uppercase tracking-tighter">Drag gizmo to rotate joints</p>
        <button id="captureBtn" class="bg-gradient-to-br from-amber-400 to-orange-600 hover:from-amber-300 hover:to-orange-500 text-white font-black py-4 px-16 rounded-2xl shadow-[0_0_30px_rgba(245,158,11,0.3)] transition-all active:scale-95 uppercase tracking-widest text-sm">
            Capture & Save
        </button>
    </div>

    <div id="container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';

        let scene, camera, renderer, orbit, transformControl, raycaster;
        const joints = {}; // Store joints by name for easy access
        const mouse = new THREE.Vector2();

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.Fog(0x0f172a, 10, 30);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.toneMapping = THREE.ReinhardToneMapping;
            document.getElementById('container').appendChild(renderer.domElement);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(4, 3, 6);

            // Lighting
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
            scene.add(hemiLight);

            const spotLight = new THREE.SpotLight(0xffffff, 20);
            spotLight.position.set(5, 8, 5);
            spotLight.castShadow = true;
            scene.add(spotLight);

            // Floor
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(50, 50),
                new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Material
            const woodMat = new THREE.MeshStandardMaterial({ 
                color: 0xba8a5d, 
                roughness: 0.4, 
                metalness: 0.1,
                flatShading: false
            });

            buildCharacter(woodMat);

            // Controls
            orbit = new OrbitControls(camera, renderer.domElement);
            orbit.target.set(0, 1, 0);
            orbit.update();
            
            transformControl = new TransformControls(camera, renderer.domElement);
            transformControl.setMode('rotate');
            transformControl.setSize(0.8);
            scene.add(transformControl);

            raycaster = new THREE.Raycaster();
            window.addEventListener('mousedown', onMouseDown);
            window.addEventListener('resize', onWindowResize);

            // UI Listeners
            document.getElementById('lensSelect').addEventListener('change', e => {
                camera.fov = e.target.value;
                camera.updateProjectionMatrix();
            });
            document.getElementById('captureBtn').addEventListener('click', () => {
                const link = document.createElement('a');
                link.download = 'character-pose.png';
                link.href = renderer.domElement.toDataURL();
                link.click();
            });
        }

        function buildCharacter(material) {
            const createPart = (geo, mat, name, parent) => {
                const mesh = new THREE.Mesh(geo, mat);
                mesh.name = name;
                mesh.castShadow = true;
                parent.add(mesh);
                return mesh;
            };

            const jointGeo = new THREE.SphereGeometry(0.1, 32, 32);
            const limbGeo = (len) => new THREE.CylinderGeometry(0.08, 0.06, len, 16);

            // --- HIERARCHY ---
            // Root - Pelvis
            const pelvis = createPart(new THREE.CapsuleGeometry(0.15, 0.2, 4, 16), material, "pelvis", scene);
            pelvis.position.y = 1.1;
            joints.pelvis = pelvis;

            // Spine to Neck
            const spine = createPart(new THREE.CapsuleGeometry(0.18, 0.4, 4, 16), material, "spine", pelvis);
            spine.position.y = 0.35;
            joints.spine = spine;

            const head = createPart(new THREE.SphereGeometry(0.15, 32, 32), material, "head", spine);
            head.position.y = 0.45;
            head.scale.y = 1.2;
            joints.head = head;

            // Arms (L/R)
            const setupArm = (side) => {
                const sign = side === 'L' ? -1 : 1;
                const shoulder = createPart(jointGeo, material, `${side}_shoulder`, spine);
                shoulder.position.set(sign * 0.3, 0.25, 0);
                
                const upperArm = createPart(limbGeo(0.4), material, `${side}_upperarm`, shoulder);
                upperArm.position.y = -0.2;
                
                const elbow = createPart(jointGeo, material, `${side}_elbow`, upperArm);
                elbow.position.y = -0.2;
                
                const lowerArm = createPart(limbGeo(0.4), material, `${side}_lowerarm`, elbow);
                lowerArm.position.y = -0.2;

                joints[`${side}_shoulder`] = shoulder;
                joints[`${side}_elbow`] = elbow;
            };

            // Legs (L/R)
            const setupLeg = (side) => {
                const sign = side === 'L' ? -1 : 1;
                const hip = createPart(jointGeo, material, `${side}_hip`, pelvis);
                hip.position.set(sign * 0.15, -0.15, 0);
                
                const thigh = createPart(limbGeo(0.5), material, `${side}_thigh`, hip);
                thigh.position.y = -0.25;
                
                const knee = createPart(jointGeo, material, `${side}_knee`, thigh);
                knee.position.y = -0.25;
                
                const calf = createPart(limbGeo(0.5), material, `${side}_calf`, knee);
                calf.position.y = -0.25;

                joints[`${side}_hip`] = hip;
                joints[`${side}_knee`] = knee;
            };

            setupArm('L'); setupArm('R');
            setupLeg('L'); setupLeg('R');
        }

        function onMouseDown(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(Object.values(joints), true);
            if (intersects.length > 0) {
                const target = intersects[0].object;
                transformControl.attach(target);
            } else if (!transformControl.dragging) {
                transformControl.detach();
            }
        }

        window.applyPose = (type) => {
            // Reset all
            Object.values(joints).forEach(j => j.rotation.set(0,0,0));
            
            if(type === 'run') {
                joints.L_hip.rotation.x = 0.8;
                joints.L_knee.rotation.x = 0.6;
                joints.R_hip.rotation.x = -0.5;
                joints.R_knee.rotation.x = 0.2;
                joints.L_shoulder.rotation.x = -0.8;
                joints.R_shoulder.rotation.x = 0.8;
            } else if(type === 'sit') {
                joints.L_hip.rotation.x = -Math.PI/2.2;
                joints.R_hip.rotation.x = -Math.PI/2.2;
                joints.L_knee.rotation.x = Math.PI/2.5;
                joints.R_knee.rotation.x = Math.PI/2.5;
                joints.pelvis.position.y = 0.6;
            } else {
                joints.pelvis.position.y = 1.1;
            }
        };

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
